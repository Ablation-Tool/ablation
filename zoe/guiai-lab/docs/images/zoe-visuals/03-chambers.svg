<g font-family="DejaVu Sans Mono, JetBrains Mono, monospace">
<text x="48" y="58" font-size="44" fill="#e5eefb" font-weight="700" text-anchor="start">Z O E</text>
<text x="52" y="94" font-size="29" fill="#67e8f9" font-weight="700" text-anchor="start">DETERMINISTIC × STOCHASTIC</text>
<text x="1550" y="62" font-size="15" fill="#9fb1c8" font-weight="400" text-anchor="end">LIVING GEOMETRY · INSPECTABLE FUTURES</text>
<text x="1550" y="94" font-size="16" fill="#9fb1c8" font-weight="400" text-anchor="end">distinct execution identities · one measurement boundary</text>
<rect x="55" y="145" width="710" height="350" rx="18" fill="#0d1728" stroke="#67e8f9" stroke-width="2"/><text x="77" y="175" font-size="15" fill="#67e8f9" font-weight="700" text-anchor="start">DETERMINISTIC CHAMBER</text><text x="77" y="207" font-size="25" fill="#e5eefb" font-weight="700" text-anchor="start">Reproducible measurement</text><text x="85" y="235" font-size="17" fill="#9fb1c8" font-weight="400" text-anchor="start">strict / adaptive / joint accessible volume</text><text x="85" y="280" font-size="17" fill="#9fb1c8" font-weight="400" text-anchor="start">Bayes updates · RMSE · Procrustes</text><text x="85" y="325" font-size="17" fill="#9fb1c8" font-weight="400" text-anchor="start">forecast entropy · top mass · Brier score</text><rect x="85" y="405" width="418" height="32" rx="16" fill="#111f34" stroke="#67e8f9"/><text x="94" y="426" font-size="13" fill="#67e8f9" font-weight="400" text-anchor="start">equation + inputs → measurement_recorded</text><rect x="835" y="145" width="710" height="350" rx="18" fill="#0d1728" stroke="#f0abfc" stroke-width="2"/><text x="857" y="175" font-size="15" fill="#f0abfc" font-weight="700" text-anchor="start">STOCHASTIC CHAMBER</text><text x="857" y="207" font-size="25" fill="#e5eefb" font-weight="700" text-anchor="start">Forecast / transform / sample</text><text x="865" y="235" font-size="17" fill="#9fb1c8" font-weight="400" text-anchor="start">categorical sampling with generator + seed</text><text x="865" y="280" font-size="17" fill="#9fb1c8" font-weight="400" text-anchor="start">Markov transitions and continuations</text><text x="865" y="325" font-size="17" fill="#9fb1c8" font-weight="400" text-anchor="start">temperature transforms and future distributions</text><rect x="865" y="405" width="468" height="32" rx="16" fill="#111f34" stroke="#f0abfc"/><text x="874" y="426" font-size="13" fill="#f0abfc" font-weight="400" text-anchor="start">model + context + seed → observation_recorded</text><rect x="55" y="535" width="440" height="165" rx="18" fill="#0d1728" stroke="#c4b5fd" stroke-width="2"/><text x="77" y="565" font-size="15" fill="#c4b5fd" font-weight="700" text-anchor="start">EQUATION REGISTRY</text><text x="77" y="597" font-size="25" fill="#e5eefb" font-weight="700" text-anchor="start">13 replaceable sections</text><rect x="85" y="610" width="88" height="32" rx="16" fill="#111f34" stroke="#c4b5fd"/><text x="94" y="631" font-size="13" fill="#c4b5fd" font-weight="400" text-anchor="start">no eval</text><rect x="200" y="610" width="188" height="32" rx="16" fill="#111f34" stroke="#c4b5fd"/><text x="209" y="631" font-size="13" fill="#c4b5fd" font-weight="400" text-anchor="start">custom Python API</text><rect x="555" y="535" width="440" height="165" rx="18" fill="#0d1728" stroke="#fde68a" stroke-width="2"/><text x="577" y="565" font-size="15" fill="#fde68a" font-weight="700" text-anchor="start">REJECTED ≠ DELETED</text><text x="577" y="597" font-size="25" fill="#e5eefb" font-weight="700" text-anchor="start">Adaptive threshold comparison</text><rect x="585" y="640" width="258" height="32" rx="16" fill="#111f34" stroke="#fde68a"/><text x="594" y="661" font-size="13" fill="#fde68a" font-weight="400" text-anchor="start">available for comparison</text><rect x="1055" y="535" width="490" height="165" rx="18" fill="#0d1728" stroke="#fca5a5" stroke-width="2"/><text x="1077" y="565" font-size="15" fill="#fca5a5" font-weight="700" text-anchor="start">QUARANTINED ≠ EXECUTABLE</text><text x="1077" y="597" font-size="25" fill="#e5eefb" font-weight="700" text-anchor="start">Inspectable without running</text><rect x="1085" y="640" width="218" height="32" rx="16" fill="#111f34" stroke="#fca5a5"/><text x="1094" y="661" font-size="13" fill="#fca5a5" font-weight="400" text-anchor="start">run_chamber: blocked</text><path d="M410 495 L410 535" fill="none" stroke="#67e8f9" stroke-width="2.5" marker-end="url(#arrow-cyan)"/><path d="M1190 495 L1190 535" fill="none" stroke="#f0abfc" stroke-width="2.5" marker-end="url(#arrow-magenta)"/><rect x="55" y="740" width="1490" height="170" rx="18" fill="#0d1728" stroke="#fca5a5" stroke-width="2"/><text x="77" y="770" font-size="15" fill="#fca5a5" font-weight="700" text-anchor="start">MEASUREMENT BOUNDARY</text><text x="800" y="795" font-size="24" fill="#e5eefb" font-weight="700" text-anchor="middle">a stochastic forecast can be measured deterministically</text><text x="800" y="838" font-size="18" fill="#9fb1c8" font-weight="400" text-anchor="middle">the measurement is not the forecast · sampled outcomes are not proof of correctness</text><rect x="630" y="860" width="218" height="32" rx="16" fill="#111f34" stroke="#fca5a5"/><text x="639" y="881" font-size="13" fill="#fca5a5" font-weight="400" text-anchor="start">belief_updated=False</text><text x="48" y="970" font-size="14" fill="#9fb1c8" font-weight="400" text-anchor="start">rejected and quarantined methods remain inspectable; execution never implies authorization</text><text x="1550" y="970" font-size="14" fill="#fca5a5" font-weight="400" text-anchor="end">executed=False</text></g></svg>