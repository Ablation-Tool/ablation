t><rect x="710" y="145" width="380" height="475" rx="18" fill="#0d1728" stroke="#c4b5fd" stroke-width="2"/><text x="732" y="175" font-size="15" fill="#c4b5fd" font-weight="700" text-anchor="start">INSPECTION HEURISTIC</text><text x="732" y="207" font-size="25" fill="#e5eefb" font-weight="700" text-anchor="start">value × gain ÷ effort</text><text x="740" y="250" font-size="19" fill="#9fb1c8" font-weight="400" text-anchor="start">rank, do not authorize</text><path d="M820 305 L820 365" fill="none" stroke="#c4b5fd" stroke-width="2.5" marker-end="url(#arrow-purple)"/><text x="820" y="415" font-size="18" fill="#9fb1c8" font-weight="400" text-anchor="middle">review rationale</text><path d="M820 455 L820 505" fill="none" stroke="#c4b5fd" stroke-width="2.5" marker-end="url(#arrow-purple)"/><text x="820" y="555" font-size="18" fill="#9fb1c8" font-weight="400" text-anchor="middle">record choice</text><rect x="1175" y="145" width="370" height="475" rx="18" fill="#0d1728" stroke="#fde68a" stroke-width="2"/><text x="1197" y="175" font-size="15" fill="#fde68a" font-weight="700" text-anchor="start">HUMAN DECISION</text><text x="1197" y="207" font-size="25" fill="#e5eefb" font-weight="700" text-anchor="start">review required</text><text x="1205" y="250" font-size="18" fill="#9fb1c8" font-weight="400" text-anchor="start">1. choose investigation</text><text x="1205" y="308" font-size="18" fill="#9fb1c8" font-weight="400" text-anchor="start">2. record rationale</text><text x="1205" y="366" font-size="18" fill="#9fb1c8" font-weight="400" text-anchor="start">3. inspect result</text><text x="1205" y="424" font-size="18" fill="#9fb1c8" font-weight="400" text-anchor="start">4. decide next action</text><rect x="1205" y="535" width="158" height="32" rx="16" fill="#111f34" stroke="#fca5a5"/><text x="1214" y="556" font-size="13" fill="#fca5a5" font-weight="400" text-anchor="start">executed=False</text><path d="M625 385 L670 385" fill="none" stroke="#86efac" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-green)"/><path d="M1090 385 L1170 385" fill="none" stroke="#c4b5fd" stroke-width="2.5" stroke-dasharray="8 7" marker-end="url(#arrow-purple)"/><rect x="710" y="675" width="835" height="235" rx="18" fill="#0d1728" stroke="#86efac" stroke-width="2"/><text x="732" y="705" font-size="15" fill="#86efac" font-weight="700" text-anchor="start">NEXT TEST</text><text x="732" y="737" font-size="25" fill="#e5eefb" font-weight="700" text-anchor="start">Inspect RCS header + compare tree IDs</text><text x="740" y="755" font-size="16" fill="#9fb1c8" font-weight="400" text-anchor="start">The queue preserves evidence value, expected information gain, and effort.</text><text x="740" y="790" font-size="16" fill="#9fb1c8" font-weight="400" text-anchor="start">It does not convert a score into permission or execution.</text><rect x="740" y="825" width="218" height="32" rx="16" fill="#111f34" stroke="#fde68a"/><text x="749" y="846" font-size="13" fill="#fde68a" font-weight="400" text-anchor="start">review_required=True</text><rect x="1050" y="825" width="158" height="32" rx="16" fill="#111f34" stroke="#fca5a5"/><text x="1059" y="846" font-size="13" fill="#fca5a5" font-weight="400" text-anchor="start">executed=False</text><text x="48" y="970" font-size="14" fill="#9fb1c8" font-weight="400" text-anchor="start">decision support ranks attention; the human chooses what happens next</text><text x="1550" y="970" font-size="14" fill="#fca5a5" font-weight="400" text-anchor="end">executed=False</text></g></svg>