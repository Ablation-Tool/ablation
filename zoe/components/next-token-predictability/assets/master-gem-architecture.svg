ified memory         │</tspan></text><text x="52" y="992" xml:space="preserve"><tspan fill="#9fb1c8">  └────────────────────────────────────────────────────────────────────────────────────────────────────────┘</tspan></text><text x="52" y="1021" xml:space="preserve"><tspan fill="#9fb1c8">            │                            │                            │                             │                            │</tspan></text><text x="52" y="1050" xml:space="preserve"><tspan fill="#9fb1c8">            └────────────────────────────┴────────────────────────────┴─────────────────────────────┴────────────────────────────┘</tspan></text><text x="52" y="1079" xml:space="preserve"><tspan fill="#9fb1c8">                                                                      │</tspan></text><text x="52" y="1108" xml:space="preserve"><tspan fill="#9fb1c8">                    ┌──────────────────────────────────────────┼──────────────────────────────────────────┐</tspan></text><text x="52" y="1137" xml:space="preserve"><tspan fill="#9fb1c8">                    ▼                                          ▼                                          ▼</tspan></text><text x="52" y="1166" xml:space="preserve"><tspan fill="#9fb1c8">             ┌─ </tspan><tspan fill="#fde68a" font-weight="700">EXPORTS</tspan><tspan fill="#9fb1c8"> ──────────────┐              ┌─ </tspan><tspan fill="#fde68a" font-weight="700">EVIDENCE FLOW</tspan><tspan fill="#9fb1c8"> ──────────┐               ┌─ </tspan><tspan fill="#93c5fd" font-weight="700">TWO MODES</tspan><tspan fill="#9fb1c8"> ───────────────┐</tspan></text><text x="52" y="1195" xml:space="preserve"><tspan fill="#9fb1c8">             │ SVG · PNG · GEM VDI    │              │ Observe → measure        │               │ gem-helen = lightweight   │</tspan></text><text x="52" y="1224" xml:space="preserve"><tspan fill="#9fb1c8">             │ Versioned scene JSON   │              │ Recommend → </tspan><tspan fill="#fde68a" font-weight="700">human d