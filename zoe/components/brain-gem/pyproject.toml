[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "brain-gem"
version = "0.1.0"
description = "Standalone Bayesian field notebook and chambered memory"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
brain-gem = "brain_gem.cli:main"
gem-notebook = "brain_gem.cli:main"

[tool.setuptools]
license-files = ["NOTICE", "licenses/*.txt"]

[tool.setuptools.package-data]
brain_gem = ["data/*.json.gz"]

[tool.setuptools.packages.find]
include = ["brain_gem*"]
