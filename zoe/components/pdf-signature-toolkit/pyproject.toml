[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-signature-toolkit"
version = "1.0.0"
description = "Reproducible LaTeX source integrity records and PKCS #7 detached PDF signatures"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
pdf-sign = "pdf_signature_toolkit.sign:main"
pdf-verify = "pdf_signature_toolkit.verify:main"

[tool.setuptools.packages.find]
include = ["pdf_signature_toolkit*"]
