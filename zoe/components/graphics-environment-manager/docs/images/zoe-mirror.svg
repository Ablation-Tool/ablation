  <g data-object-id="metrics-retrograde">
    <title>metrics-retrograde</title>
    <text x="604.0" y="170.0" font-family="sans-serif" font-size="14.0" fill="#ffffff">A=1  complement=7  momentum=0</text>
  </g>
  <g data-object-id="correctness-retrograde">
    <title>correctness-retrograde</title>
    <text x="604.0" y="200.0" font-family="sans-serif" font-size="13.0" fill="#ff00ff">top-1=correct  max-p=0.954</text>
  </g>
  <g data-object-id="source-retrograde">
    <title>source-retrograde</title>
    <text x="604.0" y="232.0" font-family="sans-serif" font-size="12.0" fill="#d3d3d3">index=1  tau=0.050  T=1.00</text>
  </g>
  <g data-object-id="prediction-retrograde">
    <title>prediction-retrograde</title>
    <text x="604.0" y="267.0" font-family="sans-serif" font-size="13.0" fill="#ffffff">predicted=3  target=3</text>
  </g>
  <g data-object-id="entropy-retrograde">
    <title>entropy-retrograde</title>
    <text x="604.0" y="300.0" font-family="sans-serif" font-size="13.0" fill="#d3d3d3">entropy=0.275 bits</text>
  </g>
  <g data-object-id="recommendation-retrograde">
    <title>recommendation-retrograde</title>
    <text x="604.0" y="337.0" font-family="sans-serif" font-size="12.0" fill="#ff00ff">next=research</text>
  </g>
  <g data-object-id="condition-retrograde">
    <title>condition-retrograde</title>
    <text x="604.0" y="370.0" font-family="sans-serif" font-size="13.0" fill="#ff00ff">retrograde</text>
  </g>
  <g data-object-id="no-mixture-retrograde">
    <title>no-mixture-retrograde</title>
    <text x="604.0" y="410.0" font-family="sans-serif" font-size="12.0" fill="#d3d3d3">distribution retained separately</text>
  </g>
  <g data-object-id="agreement">
    <title>agreement</title>
    <text x="42.0" y="527.0" font-family="sans-serif" font-size="17.0" fill="#ffffff">argmax: same   volume delta (forward - retrograde): +0</text>
  </g>
  <g data-object-id="recommendation">
    <title>recommendation</title>
    <text x="42.0" y="567.0" font-family="sans-serif" font-size="12.0" fill="#ffff00">Next: research · Preserve both observations and their matched index before another experiment.</text>
  </g>
  <g data-object-id="memory">
    <title>memory</title>
    <text x="42.0" y="600.0" font-family="sans-serif" font-size="13.0" fill="#d3d3d3">2 mirrored observations · 0 exports · both directions preserved</text>
  </g>
  <g data-object-id="scope">
    <title>scope</title>
    <text x="42.0" y="632.0" font-family="sans-serif" font-size="13.0" fill="#ff0000">Paired evaluation, not causal reversal or consciousness · executed=False · human decides</text>
  </g>
  <g data-object-id="privacy">
    <title>privacy</title>
    <text x="42.0" y="657.0" font-family="sans-serif" font-size="11.0" fill="#d3d3d3">Lazy local HELEN evidence · no model runtime or automatic action</text>
  </g>
