<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="742" viewBox="0 0 1100 680" role="img" aria-label="GEM mirrored brain">
  <title>GEM mirrored brain</title>
  <rect x="0" y="0" width="1100.0" height="680.0" fill="#ffffff" />
  <g data-object-id="background">
    <title>background</title>
    <rect x="0.0" y="0.0" width="1100.0" height="680.0" fill="#000000" stroke="#000000" stroke-width="1.0" />
  </g>
  <g data-object-id="title">
    <title>title</title>
    <text x="36.0" y="43.0" font-family="sans-serif" font-size="25.0" fill="#00ffff">ZOE · MIRRORED BRAIN</text>
  </g>
  <g data-object-id="subtitle">
    <title>subtitle</title>
    <text x="36.0" y="73.0" font-family="sans-serif" font-size="14.0" fill="#d3d3d3">One inspectable pair. Two directions. No hidden averaging.</text>
  </g>
  <g data-object-id="panel-forward">
    <title>panel-forward</title>
    <rect x="28.0" y="100.0" width="480.0" height="386.0" fill="#000000" stroke="#00ffff" stroke-width="2.0" />
  </g>
  <g data-object-id="title-forward">
    <title>title-forward</title>
    <text x="56.0" y="135.0" font-family="sans-serif" font-size="19.0" fill="#00ffff">FORWARD</text>
  </g>
  <g data-object-id="panel-retrograde">
    <title>panel-retrograde</title>
