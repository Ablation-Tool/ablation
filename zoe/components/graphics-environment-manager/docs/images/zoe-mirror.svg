  <g data-object-id="metrics-forward">
    <title>metrics-forward</title>
    <text x="56.0" y="170.0" font-family="sans-serif" font-size="14.0" fill="#ffffff">A=1  complement=7  momentum=0</text>
  </g>
  <g data-object-id="correctness-forward">
    <title>correctness-forward</title>
    <text x="56.0" y="200.0" font-family="sans-serif" font-size="13.0" fill="#00ffff">top-1=correct  max-p=0.954</text>
  </g>
  <g data-object-id="source-forward">
    <title>source-forward</title>
    <text x="56.0" y="232.0" font-family="sans-serif" font-size="12.0" fill="#d3d3d3">index=1  tau=0.050  T=1.00</text>
  </g>
  <g data-object-id="prediction-forward">
    <title>prediction-forward</title>
    <text x="56.0" y="267.0" font-family="sans-serif" font-size="13.0" fill="#ffffff">predicted=3  target=3</text>
