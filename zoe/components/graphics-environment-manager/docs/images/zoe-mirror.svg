  </g>
  <g data-object-id="condition-forward">
    <title>condition-forward</title>
    <text x="56.0" y="370.0" font-family="sans-serif" font-size="13.0" fill="#00ffff">forward</text>
  </g>
  <g data-object-id="no-mixture-forward">
