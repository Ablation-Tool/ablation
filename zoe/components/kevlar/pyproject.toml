[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "kevlar"
version = "0.1.0"
description = "MCP stdio CDR proxy firewall"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Ablation-Tool" }]

[project.scripts]
kevlar = "kevlar:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
py-modules = ["kevlar", "policy"]
