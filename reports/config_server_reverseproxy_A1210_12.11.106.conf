Define SOCKET_NAME /run/dev-conf/proxysocket.sock
Define WS_SOCKET_NAME /run/dev-conf/wsproxysocket.sock

AllowEncodedSlashes NoDecode

<Location "/config">
  Require axis-group viewer
</Location>

<Location "/devconf">
  Require axis-group viewer
</Location>

<Location "/config/rest/user-management">
  # Prevent merging of authentication directives from the parent /config location
  AuthMerging Off
  <If "%{QUERY_STRING} =~ /anonymous=true/">
    Require all granted
  </If>
  <Else>
    Require axis-group viewer
  </Else>
</Location>

<Proxy "ws://host/config/notification">
  RequestHeader set X-Remote-User expr=%{REMOTE_USER}
  RequestHeader set X-Remote-User-Group %{USER_GROUPS}e
  RequestHeader set X-Remote-Port expr=%{REMOTE_PORT}
</Proxy>

ProxyPass        "/config/notification" "unix:${WS_SOCKET_NAME}|ws://host/config/notification"
ProxyPassReverse "/config/notification" "unix:${WS_SOCKET_NAME}|ws://host/config/notification"

ProxyPass        "/devconf/notification" "unix:${WS_SOCKET_NAME}|ws://host/config/notification"
ProxyPassReverse "/devconf/notification" "unix:${WS_SOCKET_NAME}|ws://host/config/notification"

<Proxy "http://host/config/">
  RequestHeader set X-Remote-User expr=%{REMOTE_USER}
  RequestHeader set X-Remote-User-Group %{USER_GROUPS}e
  RequestHeader set X-Remote-Port expr=%{REMOTE_PORT}
</Proxy>

ProxyPass        "/config" "unix:${SOCKET_NAME}|http://host/config" nocanon
ProxyPassReverse "/config" "unix:${SOCKET_NAME}|http://host/config" nocanon

ProxyPass        "/devconf" "unix:${SOCKET_NAME}|http://host/config" nocanon
ProxyPassReverse "/devconf" "unix:${SOCKET_NAME}|http://host/config" nocanon
