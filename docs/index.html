<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ablation Documentation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">
  <style>
    :root { --theme-color: #c0392b; }
    .sidebar > h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.08em; }
    .search input { border-radius: 3px; }
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: 'ABLATION',
      nameLink: '/',
      repo: 'https://github.com/Ablation-Tool/ablation',
      homepage: 'index.md',
      loadSidebar: '_sidebar.md',
      subMaxLevel: 2,
      auto2top: true,
      themeColor: '#c0392b',
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Search documentation...',
        noData: 'No results.',
        depth: 6,
        hideOtherSidebarContent: false,
      },
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
</body>
</html>
