name: GUIAI native macOS

on:
  push:
  pull_request:

jobs:
  native:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build native package
        run: |
          python -m pip install build
          python guiai-lab/packaging/build_macos.py
      - name: Extract package
        run: unzip -q guiai-lab/dist/GUIAI-macOS.zip -d /tmp/guiai-macos-native
      - name: Install and validate native macOS
        run: bash /tmp/guiai-macos-native/install_macos.sh
      - name: Upload native package
        uses: actions/upload-artifact@v4
        with:
          name: GUIAI-macOS
          path: guiai-lab/dist/GUIAI-macOS.zip
          if-no-files-found: error
