name: GEM native Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build native package
        shell: pwsh
        run: |
          python -m pip install build
          python gem-lab/packaging/build_windows_native.py
      - name: Extract package
        shell: pwsh
        run: Expand-Archive -Path gem-lab/dist/GEM-Windows-Native.zip -DestinationPath /tmp/gem-windows-native
      - name: Install and validate native Windows
        shell: pwsh
        run: /tmp/gem-windows-native/Install-WindowsNative.ps1
      - name: Upload native package
        uses: actions/upload-artifact@v4
        with:
          name: GEM-Windows-Native
          path: gem-lab/dist/GEM-Windows-Native.zip
          if-no-files-found: error
