name: GUIAI native Windows

on:
  push:
  pull_request:

jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build native package
        shell: pwsh
        run: |
          python -m pip install build
          python guiai-lab/packaging/build_windows_native.py
      - name: Extract package
        shell: pwsh
        run: Expand-Archive -Path guiai-lab/dist/GUIAI-Windows-Native.zip -DestinationPath /tmp/guiai-windows-native
      - name: Install and validate native Windows
        shell: pwsh
        run: /tmp/guiai-windows-native/Install-WindowsNative.ps1
      - name: Upload native package
        uses: actions/upload-artifact@v4
        with:
          name: GUIAI-Windows-Native
          path: guiai-lab/dist/GUIAI-Windows-Native.zip
          if-no-files-found: error
